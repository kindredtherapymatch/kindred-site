<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Therapist Profile &mdash; Kindred</title>
<meta name="description" content="See this therapist's Kindred profile &mdash; how they work, who they work best with, and whether you two would work well together.">
<!-- STATIC FALLBACK, and for link previews it is the only thing that counts:
     Facebook, iMessage, Slack and LinkedIn do not run JavaScript, so they see
     these tags and never the per-therapist ones setSocialMeta() writes. Real
     per-therapist previews arrive with prerendering (step 5). -->
<meta property="og:title" content="A therapist on Kindred">
<meta property="og:description" content="See how they work, who they work best with, and whether you two would be a fit.">
<meta property="og:site_name" content="Kindred">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..600;1,7..72,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M30 8 C44 8 46 20 46 34 L46 66 C46 82 42 92 30 92 C24 92 22 84 22 66 L22 34 C22 16 24 8 30 8 Z' fill='%23422448'/><path d='M52 34 C52 20 62 10 78 8 C80 22 72 36 56 38 C53.5 38.3 52 37 52 34 Z' fill='%23B8A3C4'/><path d='M52 46 C68 46 78 56 80 72 C66 74 52 66 52 50 Z' fill='%23BE765F'/></svg>">
<style>
/* ===========================================================================
   Structural shell only. The template's entire look — tokens, nav, layout,
   sections — is injected by profile.js as #site-css, per the therapist's
   chosen template (t.site.template, 0045). Anything visual left here would
   fight all six templates at once, so only three things live in this file:
   the reset, the Kindred ribbon (platform chrome, deliberately untemplated),
   and the loading/missing states that render before a template is known.
   =========================================================================== */
*{box-sizing:border-box}
/* The [hidden] attribute loses to any class that sets display -- the ribbon
   is display:flex, so without this it showed for every visitor. Same trap as
   the app's bottom-nav tracker; global rule this time. */
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:#FAF4EC;color:#3A2C40;
     font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
     font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}

.kribbon{display:flex;align-items:center;gap:1em;background:#422448;color:#EFE7F2;
         padding:.55rem 22px;font-size:.78rem}
.kribbon a{color:#EFE7F2;text-decoration:none;font-weight:700}
.kribbon .kword{margin-left:auto;display:inline-flex;align-items:center;gap:.4em;
                font-weight:700;letter-spacing:.05em}
.kribbon svg{width:12px;height:12px}

.state{max-width:560px;margin:14vh auto 0;padding:0 22px;text-align:center}
.state h1{font-family:'Literata',Georgia,serif;font-weight:500;
          font-size:clamp(1.7rem,4vw,2.3rem);margin:0 0 .6rem;line-height:1.2}
.state p{color:#77687D;margin:0 0 1.4rem}
.state .btn{display:inline-block;background:#A85B44;color:#FFF8F2;text-decoration:none;
            font-weight:700;font-size:.95rem;padding:.85em 1.7em;border-radius:999px}
</style>
</head>
<body>

<div class="kribbon" id="kt-ribbon" hidden>
  <a href="/app/#match">&larr; Back to browsing therapists</a>
  <span class="kword"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M30 8 C44 8 46 20 46 34 L46 66 C46 82 42 92 30 92 C24 92 22 84 22 66 L22 34 C22 16 24 8 30 8 Z" fill="#B8A3C4"/><path d="M52 34 C52 20 62 10 78 8 C80 22 72 36 56 38 C53.5 38.3 52 37 52 34 Z" fill="#B8A3C4"/><path d="M52 46 C68 46 78 56 80 72 C66 74 52 66 52 50 Z" fill="#BE765F"/></svg> kindred</span>
</div>

<div class="state" id="kp-loading"><p>Loading&hellip;</p></div>

<div class="state" id="kp-missing" hidden>
  <h1>We couldn't find that profile.</h1>
  <p>The link may be out of date, or this therapist isn't on Kindred any more.</p>
  <a class="btn" href="/app/#match">Find a Therapist</a>
</div>

<div id="site" hidden></div>

<script src="profile.js?v=18"></script>
</body>
</html>
